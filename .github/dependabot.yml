version: 2
updates:
  - package-ecosystem: nuget
    directory: /source
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      dotnet-patch-and-minor:
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    groups:
      action-patch-and-minor:
        update-types: [patch, minor]
